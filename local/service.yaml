apiVersion: v1
kind: Service
metadata:
  name: nullroute-bgp
  namespace: nullroute
  annotations:
    metallb.io/address-pool: local-pool
    metallb.io/loadBalancerIPs: 10.0.39.197
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  # SingleStack: the dual-stack LB made k3s's IPv6 kube-proxy fight the IPv4 one
  # for healthCheckNodePort 32458 (event spam every 30s). Peers talk to the
  # node IPs directly, so the v6 LB address was unused.
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  selector:
    app: nullroute
  ports:
    - name: bgp
      port: 179
      targetPort: 179
      protocol: TCP
